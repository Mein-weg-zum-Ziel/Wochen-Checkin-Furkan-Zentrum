<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Furkan Zentrum – Wochen-Check-in</title>
<style>

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    .spin { animation: fz-spin 0.9s linear infinite; }
    @keyframes fz-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fz-root { --bg:#0A1120; --bg-elevated:#111B2E; --surface:#16223A; --surface-2:#1D2C48;
      --border:#26385A; --text:#EAF2FB; --text-muted:#91A6C4; --accent:#5FD0F0; --accent-strong:#34AEDA;
      --accent-soft:rgba(95,208,240,0.14); --gold:#D9B36C; --success:#38D9A9; --warning:#F5A524; --danger:#F2586B;
      font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh;
      display:flex; flex-direction:column; position:relative; }
    .fz-root[data-theme='light'] { --bg:#F3F8FC; --bg-elevated:#FFFFFF; --surface:#FFFFFF; --surface-2:#EAF3FA;
      --border:#D7E4EF; --text:#142235; --text-muted:#54708A; --accent:#1B93C4; --accent-strong:#0F729E;
      --accent-soft:rgba(27,147,196,0.10); --gold:#B78A3D; --success:#0E9C82; --warning:#C6790F; --danger:#D93B54; }
    .fz-root * { box-sizing:border-box; }
    .fz-scroll { flex:1; overflow-y:auto; padding:20px 16px 96px; max-width:480px; margin:0 auto; width:100%; }
    .fz-header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border);
      padding:14px 16px; display:flex; align-items:center; gap:12px; max-width:480px; margin:0 auto; width:100%; }
    .fz-logo-badge { width:40px; height:40px; border-radius:12px; background:linear-gradient(155deg,var(--surface-2),var(--bg-elevated));
      border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
    .fz-logo-badge img { width:26px; height:26px; object-fit:contain; }
    .fz-header-title { font-family:'Outfit',sans-serif; font-weight:700; font-size:15px; line-height:1.2; }
    .fz-header-sub { font-size:11.5px; color:var(--text-muted); }
    .theme-toggle { margin-left:auto; width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
      background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
    .hero { position:relative; overflow:hidden; border-radius:20px; padding:22px 18px; background:linear-gradient(160deg,var(--surface-2),var(--bg-elevated));
      border:1px solid var(--border); margin-bottom:16px; }
    .star-field { position:absolute; inset:0; width:100%; height:100%; color:var(--accent); opacity:0.05; pointer-events:none; }
    .hero-content { position:relative; z-index:1; }
    .hero-eyebrow { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
    .hero-title { font-family:'Outfit',sans-serif; font-size:22px; font-weight:700; margin:6px 0 4px; }
    .hero-sub { font-size:13.5px; color:var(--text-muted); line-height:1.5; }
    .stat-row { display:flex; gap:10px; margin-top:16px; }
    .stat-pill { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
    .stat-pill-num { font-family:'Outfit',sans-serif; font-size:18px; font-weight:700; display:flex; align-items:center; gap:5px; }
    .stat-pill-label { font-size:10.5px; color:var(--text-muted); margin-top:2px; }
    .section-title { font-family:'Outfit',sans-serif; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
      color:var(--text-muted); margin:22px 0 10px; }
    .big-btn { width:100%; display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; text-align:left; color:var(--text); transition:border-color .15s, transform .1s; }
    .big-btn:active { transform:scale(0.98); }
    .big-btn:hover { border-color:var(--accent); }
    .big-btn-icon { width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent-strong);
      display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .big-btn-text { display:flex; flex-direction:column; flex:1; }
    .big-btn-label { font-weight:600; font-size:14.5px; }
    .big-btn-sub { font-size:12px; color:var(--text-muted); margin-top:1px; }
    .big-btn-chevron { color:var(--text-muted); }
    .min-banner { border-radius:14px; padding:12px 14px; border:1px solid var(--border); margin-bottom:16px; }
    .min-banner.ok { background:rgba(56,209,169,0.08); border-color:var(--success); }
    .min-banner.warn { background:rgba(242,88,107,0.08); border-color:var(--danger); }
    .min-banner-head { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; margin-bottom:8px; }
    .min-banner.ok .min-banner-head { color:var(--success); }
    .min-banner.warn .min-banner-head { color:var(--danger); }
    .min-banner-items { display:flex; flex-wrap:wrap; gap:6px; }
    .min-chip { font-size:11px; padding:4px 8px; border-radius:8px; border:1px solid var(--border); }
    .min-chip.ok { color:var(--success); border-color:var(--success); }
    .min-chip.open { color:var(--danger); border-color:var(--danger); }
    .group-block { margin-bottom:18px; }
    .group-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .group-head-icon { width:26px; height:26px; border-radius:8px; background:var(--accent-soft); color:var(--accent-strong);
      display:flex; align-items:center; justify-content:center; }
    .group-head-title { font-weight:700; font-size:13.5px; }
    .group-head-hint { font-size:11px; color:var(--text-muted); }
    .check-row { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--border);
      border-radius:12px; margin-bottom:7px; cursor:pointer; background:var(--surface); }
    .check-row.checked { border-color:var(--accent); background:var(--accent-soft); }
    .checkbox { width:20px; height:20px; border-radius:6px; border:2px solid var(--border); flex-shrink:0;
      display:flex; align-items:center; justify-content:center; color:white; }
    .check-row.checked .checkbox { background:var(--accent); border-color:var(--accent); }
    .check-label { font-size:13.5px; }
    .prayer-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .prayer-chip { padding:9px 14px; border-radius:20px; border:1px solid var(--border); font-size:13px; cursor:pointer; background:var(--surface); }
    .prayer-chip.checked { background:var(--accent); border-color:var(--accent); color:#04202b; font-weight:700; }
    .recurring-item { border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px; background:var(--surface); }
    .recurring-item-label { font-size:13.5px; font-weight:600; margin-bottom:8px; }
    .recurring-chip-row { display:flex; flex-wrap:wrap; gap:7px; }
    .recurring-chip { padding:7px 11px; border-radius:16px; border:1px solid var(--border); font-size:11.5px; cursor:pointer; background:var(--bg); color:var(--text-muted); }
    .recurring-chip.active { border-color:var(--accent-strong); color:var(--text); font-weight:600; }
    .recurring-chip.active.counts { background:var(--success); border-color:var(--success); color:#04202b; }
    .goal-input-row { display:flex; gap:8px; margin-bottom:10px; }
    .goal-input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-size:13.5px; }
    .goal-add-btn { width:40px; border-radius:10px; background:var(--accent); border:none; color:#04202b; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .goal-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:7px; }
    .goal-remove { margin-left:auto; color:var(--text-muted); background:none; border:none; cursor:pointer; }
    .primary-btn { width:100%; padding:15px; border-radius:14px; background:var(--accent); border:none; color:#04202b;
      font-weight:700; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
    .primary-btn:disabled { opacity:0.6; }
    .secondary-btn { width:100%; padding:13px; border-radius:14px; background:transparent; border:1px solid var(--border); color:var(--text);
      font-weight:600; font-size:13.5px; cursor:pointer; margin-top:8px; }
    .textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
      color:var(--text); font-size:13px; margin-top:6px; resize:vertical; min-height:56px; font-family:'Inter',sans-serif; }
    .field-label { font-size:12.5px; font-weight:600; margin-top:12px; display:block; }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
    .switch { width:42px; height:24px; border-radius:12px; background:var(--border); position:relative; cursor:pointer; flex-shrink:0; }
    .switch.on { background:var(--accent); }
    .switch-knob { width:18px; height:18px; border-radius:50%; background:white; position:absolute; top:3px; left:3px; transition:left .15s; }
    .switch.on .switch-knob { left:21px; }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--bg-elevated); border-top:1px solid var(--border);
      display:flex; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); z-index:10; max-width:480px; margin:0 auto; }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
      color:var(--text-muted); font-size:10.5px; padding:6px 0; cursor:pointer; border-radius:10px; }
    .nav-item.active { color:var(--accent); }
    .login-wrap { min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px; max-width:420px; margin:0 auto; }
    .login-logo { width:88px; height:88px; border-radius:22px; background:linear-gradient(155deg,var(--surface-2),var(--bg-elevated));
      border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
    .login-logo img { width:58px; height:58px; object-fit:contain; }
    .login-title { font-family:'Outfit',sans-serif; font-size:24px; font-weight:800; text-align:center; }
    .login-sub { font-size:13px; color:var(--text-muted); text-align:center; margin-top:6px; line-height:1.5; }
    .input-field { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px;
      color:var(--text); font-size:14px; margin-top:14px; }
    .input-note { font-size:11px; color:var(--text-muted); margin-top:5px; }
    .error-text { color:var(--danger); font-size:12.5px; margin-top:8px; }
    .result-card { text-align:center; padding:26px 18px; }
    .result-status { font-family:'Outfit',sans-serif; font-weight:700; font-size:18px; margin-top:14px; }
    .result-text { font-size:13.5px; color:var(--text-muted); line-height:1.6; margin-top:10px; text-align:left; }
    .result-block { text-align:left; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
    .result-block-label { font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); font-weight:700; margin-bottom:4px; }
    .summary-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .summary-row:last-child { border-bottom:none; }
    .badge-ok { color:var(--success); font-weight:600; }
    .badge-open { color:var(--danger); font-weight:600; }
    .empty-state { text-align:center; padding:30px 16px; color:var(--text-muted); }
    .reaction-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .reaction-btn { padding:11px 8px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
      font-size:12px; text-align:center; cursor:pointer; color:var(--text); }
    .reaction-btn.sent { border-color:var(--accent); background:var(--accent-soft); }
    .history-item { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--border); border-radius:14px; margin-bottom:8px; }
    .history-pct { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; border:2px solid; }
    .history-week { font-weight:600; font-size:13.5px; }
    .history-status { font-size:11.5px; color:var(--text-muted); }
    .badge-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .badge-item { display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-strong);
      padding:6px 10px; border-radius:20px; font-size:11.5px; font-weight:600; }
    .stepper-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .back-btn { width:34px; height:34px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); }
  </style>
</head>

/* ---------- Storage (localStorage wrapper, mimics async artifact storage API) ---------- */
const storage = {
  get(key, shared) {
    return new Promise((resolve) => {
      const scope = shared ? "shared__" : "personal__";
      const val = localStorage.getItem(scope + key);
      resolve(val === null ? null : { key: key, value: val, shared: !!shared });
    });
  },
  set(key, value, shared) {
    return new Promise((resolve) => {
      const scope = shared ? "shared__" : "personal__";
      localStorage.setItem(scope + key, value);
      resolve({ key: key, value: value, shared: !!shared });
    });
  },
  list(prefix, shared) {
    return new Promise((resolve) => {
      const scope = shared ? "shared__" : "personal__";
      const fullPrefix = scope + (prefix || "");
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.indexOf(fullPrefix) === 0) keys.push(k.substring(scope.length));
      }
      resolve({ keys: keys, prefix: prefix, shared: !!shared });
    });
  }
};

/* ---------- Helpers ---------- */
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function getISOWeekId(date) {
  date = date || new Date();
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return d.getUTCFullYear() + "-W" + pad(weekNo);
}
function weekLabel(weekId) {
  if (!weekId) return "";
  const parts = weekId.split("-W");
  return "KW " + parseInt(parts[1], 10) + " · " + parts[0];
}
const MONTH_NAMES_DE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
function monthLabel(date) {
  date = date || new Date();
  return MONTH_NAMES_DE[date.getMonth()] + " " + date.getFullYear();
}
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function setStateField(path, value) {
  const parts = path.split(".");
  if (parts.length === 1) { state[parts[0]] = value; return; }
  let obj = state;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];

}

function getMinFlags() {
  const minUnterricht = state.checkedActivities.indexOf("dienstag") !== -1 || state.checkedActivities.indexOf("donnerstag") !== -1;
  const minGlobal = state.checkedActivities.indexOf("global") !== -1;
  const minWeekly = state.checkedActivities.indexOf("weekly") !== -1;
  return { minUnterricht: minUnterricht, minGlobal: minGlobal, minWeekly: minWeekly, minimumOk: minUnterricht && minGlobal && minWeekly };
}
function getPercentageInfo() {
  const totalPossible = ACTIVITIES.length + RECURRING_ACTIVITIES.length + PRAYERS.length + FASTING_DAYS.length + QURAN_DAYS.length + state.goals.length;
  const recurringDoneCount = RECURRING_ACTIVITIES.filter(function (r) { return state.recurringStatus[r.id] === "ja"; }).length;
  const doneGoals = state.goals.filter(function (g) { return g.done; }).length;
  const checkedCount = state.checkedActivities.length + recurringDoneCount + state.checkedPrayers.length + state.checkedFastingDays.length + state.checkedQuranDays.length + doneGoals;
  const percentage = totalPossible > 0 ? Math.round((checkedCount / totalPossible) * 100) : 0;
  return { totalPossible: totalPossible, checkedCount: checkedCount, percentage: percentage };
}

function computeStreak(history) {
  let s = 0;
  for (let i = 0; i < history.length; i++) {
    if (history[i].minimumOk) s++; else break;
  }
  return s;
}
function computeBadges(streak) {
  const b = [];
  if (streak >= 1) b.push({ label: "Minimum erfüllt", icon: "🛡️" });
  if (streak >= 4) b.push({ label: "4 Wochen stabil", icon: "🔥" });
  if (streak >= 8) b.push({ label: "Bruder, auf den man zählen kann", icon: "🏅" });
  return b;
}
function groupedActivities() {
  const g = {};
  ACTIVITIES.forEach(function (a) { (g[a.group] = g[a.group] || []).push(a); });
  return g;
}

function weekCompassSVG(percentage, minUnterricht, minGlobal, minWeekly, size) {
  size = size || 176;
  const r1 = 58, r2 = 70, cx = 88, cy = 88;
  const seg = 2 * Math.PI * r1;
  const segLen = seg / 3 - 7;
  const gap = seg - segLen;
  const outer = 2 * Math.PI * r2;
  const pillars = [
    { ok: minUnterricht, rot: -90 },
    { ok: minGlobal, rot: 30 },
    { ok: minWeekly, rot: 150 },
  ];
  let svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 176 176">';
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r2 + '" fill="none" stroke="var(--border)" stroke-width="6"/>';
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r2 + '" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" ' +
    'stroke-dasharray="' + ((percentage / 100) * outer) + ' ' + outer + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
  pillars.forEach(function (p) {
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r1 + '" fill="none" stroke="' + (p.ok ? "var(--success)" : "var(--surface-2)") + '" stroke-width="11" ' +
      'stroke-dasharray="' + segLen + ' ' + gap + '" stroke-linecap="round" transform="rotate(' + p.rot + ' ' + cx + ' ' + cy + ')"/>';
  });
  svg += '<g transform="translate(' + cx + ' ' + cy + ')" opacity="0.55" fill="var(--accent)">' +
    '<path d="M0,-13 L3.2,-3.2 L13,0 L3.2,3.2 L0,13 L-3.2,3.2 L-13,0 L-3.2,-3.2 Z"/></g>';
  svg += '<text x="' + cx + '" y="' + (cy + 34) + '" text-anchor="middle" font-size="24" font-weight="700" fill="var(--text)" font-family="Outfit, sans-serif">' + percentage + '%</text>';
  svg += '</svg>';
  return svg;
}

function renderStage() {
  if (state.stage === "home") return renderHome();
  if (state.stage === "goals") return renderGoals();
  if (state.stage === "checkin") return renderCheckin();
  if (state.stage === "result") return renderResult();
  if (state.stage === "partner") return renderPartner();
  if (state.stage === "history") return renderHistory();
  if (state.stage === "ranking") return renderRanking();
  return renderHome();
}

/* ---------- Main render dispatcher ---------- */
function render() {
  const app = document.getElementById("app");
  app.setAttribute("data-theme", state.theme);
  let html = "";
  if (state.stage === "loading") html = renderLoading();
  else if (state.stage === "gate") html = renderGate();
  else if (state.stage === "login") html = renderLogin();
  else html = renderHeader() + '<div class="fz-scroll">' + renderStage() + "</div>" + renderBottomNav();
  app.innerHTML = html;
  attachHandlers();
}
/* ---------- Data loading ---------- */
async function loadUserData(username, partner) {
  try {
    const res = await storage.get("checkin:" + username + ":" + state.weekId, true);
    state.lastResult = res && res.value ? JSON.parse(res.value) : null;
  } catch (e) { state.lastResult = null; }

  try {
    const listRes = await storage.list("checkin:" + username + ":", true);
    const entries = [];
    if (listRes && listRes.keys) {
      for (let i = 0; i < listRes.keys.length; i++) {
        try {
          const r = await storage.get(listRes.keys[i], true);
          if (r && r.value) entries.push(JSON.parse(r.value));
        } catch (e) {}
      }
    }
    entries.sort(function (a, b) { return b.weekId > a.weekId ? 1 : -1; });
    state.history = entries;
  } catch (e) { state.history = []; }

  if (partner) {
    try {
      const pres = await storage.get("checkin:" + partner + ":" + state.weekId, true);
      state.partnerCheckin = pres && pres.value ? JSON.parse(pres.value) : null;
    } catch (e) { state.partnerCheckin = null; }
  } else {
    state.partnerCheckin = null;
  }

  try {
    const rres = await storage.get("reaction:" + username + ":" + state.weekId, true);
    state.partnerReaction = rres && rres.value ? JSON.parse(rres.value) : null;
  } catch (e) { state.partnerReaction = null; }
}

async function loadRanking() {
  state.rankingLoading = true;
  render();
  try {
    const profilesRes = await storage.list("profile:", true);
    const usernames = (profilesRes && profilesRes.keys ? profilesRes.keys : []).map(function (k) { return k.slice("profile:".length); });
    const now = new Date();
    const results = [];
    for (let i = 0; i < usernames.length; i++) {
      const uname = usernames[i];
      try {
        const listRes = await storage.list("checkin:" + uname + ":", true);
        const keys = listRes && listRes.keys ? listRes.keys : [];
        let sum = 0, count = 0;
        for (let j = 0; j < keys.length; j++) {
          try {
            const r = await storage.get(keys[j], true);
            if (r && r.value) {
              const rec = JSON.parse(r.value);
              const d = new Date(rec.timestamp);
              if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                sum += rec.percentage; count++;
              }
            }
          } catch (e) {}
        }
        if (count > 0) results.push({ username: uname, avg: Math.round(sum / count), weeks: count });
      } catch (e) {}
    }
    results.sort(function (a, b) { return (b.avg - a.avg) || (b.weeks - a.weeks); });
    state.ranking = results.slice(0, 10);
    const idx = results.findIndex(function (r) { return state.me && r.username === state.me.username; });
    state.myRank = idx === -1 ? null : Object.assign({ position: idx + 1 }, results[idx]);
  } catch (e) {}
  state.rankingLoading = false;
  render();
}

async function init() {
  try {
    const gate = await storage.get("gate-passed", false);
    if (gate && gate.value === "true") {
      await continueAfterGate();
    } else {
      state.stage = "gate";
    }
  } catch (e) {
    state.stage = "gate";
  }
  render();
}

async function continueAfterGate() {
  try {
    const saved = await storage.get("my-profile", false);
    if (saved && saved.value) {
      const profile = JSON.parse(saved.value);
      state.me = profile;
      state.partnerEdit = profile.partner || "";
      await loadUserData(profile.username, profile.partner);
      state.stage = "home";
    } else {
      state.stage = "login";
    }
  } catch (e) {
    state.stage = "login";
  }
}

/* ---------- Actions ---------- */
async function handleGateSubmit() {
  if (state.passcodeInput === ACCESS_CODE) {
    state.gateError = "";
    state.loading = true;
    render();
    try { await storage.set("gate-passed", "true", false); } catch (e) {}
    state.loading = false;
    await continueAfterGate();
    render();
  } else {
    state.gateError = "Der Code ist leider falsch. Frag deinen 2er-Partner oder das Furkan-Team.";
    render();
  }
}

async function handleLogin() {
  if (!state.usernameInput.trim()) { state.error = "Bitte gib deinen Namen ein."; render(); return; }
  state.loading = true; state.error = ""; render();
  const profile = { username: state.usernameInput.trim(), partner: state.partnerInput.trim() || null };
  try {
    await storage.set("my-profile", JSON.stringify(profile), false);
    await storage.set("profile:" + profile.username, JSON.stringify(profile), true);
    state.me = profile;
    state.partnerEdit = profile.partner || "";
    await loadUserData(profile.username, profile.partner);
    state.stage = "home";
  } catch (e) { state.error = "Speichern fehlgeschlagen. Bitte erneut versuchen."; }
  state.loading = false;
  render();
}

async function savePartner() {
  if (!state.partnerEdit.trim()) return;
  state.loading = true; render();
  const updated = Object.assign({}, state.me, { partner: state.partnerEdit.trim() });
  try {
    await storage.set("my-profile", JSON.stringify(updated), false);
    await storage.set("profile:" + state.me.username, JSON.stringify(updated), true);
    state.me = updated;
    await loadUserData(updated.username, updated.partner);
  } catch (e) {}
  state.loading = false;
  render();
}

function toggleActivity(id) {
  const idx = state.checkedActivities.indexOf(id);
  if (idx === -1) state.checkedActivities.push(id); else state.checkedActivities.splice(idx, 1);
  render();
}
function togglePrayer(p) {
  const idx = state.checkedPrayers.indexOf(p);
  if (idx === -1) state.checkedPrayers.push(p); else state.checkedPrayers.splice(idx, 1);
  render();
}
function toggleFastingDay(d) {
  const idx = state.checkedFastingDays.indexOf(d);
  if (idx === -1) state.checkedFastingDays.push(d); else state.checkedFastingDays.splice(idx, 1);
  render();
}
function toggleQuranDay(d) {
  const idx = state.checkedQuranDays.indexOf(d);
  if (idx === -1) state.checkedQuranDays.push(d); else state.checkedQuranDays.splice(idx, 1);
  render();
}
function setRecurring(compositeId) {
  const parts = compositeId.split("::");
  const id = parts[0], key = parts[1];
  state.recurringStatus[id] = state.recurringStatus[id] === key ? null : key;
  render();
}
function addGoal() {
  if (!state.newGoalText.trim()) return;
  state.goals.push({ id: Date.now().toString(), text: state.newGoalText.trim(), done: false });
  state.newGoalText = "";
  render();
}
function toggleGoal(id) {
  state.goals = state.goals.map(function (g) { return g.id === id ? Object.assign({}, g, { done: !g.done }) : g; });
  render();
}
function removeGoal(id) {
  state.goals = state.goals.filter(function (g) { return g.id !== id; });
  render();
}

async function submitCheckin() {
  const flags = getMinFlags();
  if (!flags.minimumOk && !state.showReflection) { state.showReflection = true; render(); return; }
  state.loading = true; render();
  const pctInfo = getPercentageInfo();
  const evalResult = getEvaluation(pctInfo.percentage, flags.minimumOk);
  const record = {
    username: state.me.username, weekId: state.weekId, timestamp: Date.now(),
    activities: state.checkedActivities.slice(), prayers: state.checkedPrayers.slice(),
    fastingDays: state.checkedFastingDays.slice(), quranDays: state.checkedQuranDays.slice(),
    goals: state.goals.slice(), recurring: Object.assign({}, state.recurringStatus),
    minimumOk: flags.minimumOk, minUnterricht: flags.minUnterricht, minGlobal: flags.minGlobal, minWeekly: flags.minWeekly,
    percentage: pctInfo.percentage, statusKey: evalResult.key, status: evalResult.status,
    reflection: flags.minimumOk ? null : state.reflection,
  };
  try {
    await storage.set("checkin:" + state.me.username + ":" + state.weekId, JSON.stringify(record), true);
    state.lastResult = record;
    state.history = [record].concat(state.history.filter(function (h) { return h.weekId !== state.weekId; }));
    state.stage = "result";
  } catch (e) { state.error = "Check-in konnte nicht gespeichert werden."; }
  state.loading = false;
  render();
}

async function sendReaction(type) {
  if (!state.me.partner) return;
  state.loading = true; render();
  try {
    await storage.set("reaction:" + state.me.partner + ":" + state.weekId, JSON.stringify({ from: state.me.username, type: type, timestamp: Date.now() }), true);
    state.reactionSentFlag = type;
  } catch (e) {}
  state.loading = false;
  render();
}

function startNewCheckin() {
  state.checkedActivities = []; state.checkedPrayers = []; state.checkedFastingDays = []; state.checkedQuranDays = []; state.goals = []; state.recurringStatus = {};
  state.reflection = { why: "", hindernis: "", brauche: "", remindMe: false };
  state.showReflection = false;
  state.stage = "checkin";
  render();
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  render();
}

/* ---------- Event delegation ---------- */
function handleAction(action, id) {
  if (action === "toggle-theme") return toggleTheme();
  if (action === "go-stage") { state.stage = id; return render(); }
  if (action === "go-result") { state.stage = "result"; return render(); }
  if (action === "go-partner") { state.stage = "partner"; return render(); }
  if (action === "go-goals") { state.stage = "goals"; return render(); }
  if (action === "go-history") { state.stage = "history"; return render(); }
  if (action === "go-ranking") { state.stage = "ranking"; render(); return loadRanking(); }
  if (action === "start-checkin") return startNewCheckin();
  if (action === "gate-submit") return handleGateSubmit();
  if (action === "login") return handleLogin();
  if (action === "save-partner") return savePartner();
  if (action === "toggle-activity") return toggleActivity(id);
  if (action === "toggle-prayer") return togglePrayer(id);
  if (action === "toggle-fasting-day") return toggleFastingDay(id);
  if (action === "toggle-quran-day") return toggleQuranDay(id);
  if (action === "set-recurring") return setRecurring(id);
  if (action === "add-goal") return addGoal();
  if (action === "toggle-goal") return toggleGoal(id);
  if (action === "remove-goal") return removeGoal(id);
  if (action === "toggle-remind") { state.reflection.remindMe = !state.reflection.remindMe; return render(); }
  if (action === "submit-checkin") return submitCheckin();
  if (action === "send-reaction") return sendReaction(id);
}

function attachHandlers() {
  const app = document.getElementById("app");
  app.onclick = function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");
    handleAction(action, id);
  };
  const inputs = app.querySelectorAll("[data-bind]");
  inputs.forEach(function (el) {
    el.addEventListener("input", function (e) {
      setStateField(el.getAttribute("data-bind"), e.target.value);
    });
    const enterAction = el.getAttribute("data-enter-action");
    if (enterAction) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); handleAction(enterAction, el.getAttribute("data-id")); }
      });
    }
    // restore focus/cursor if this element was focused before re-render is not needed here
    // since input events don't trigger a full render for text fields.
  });
}

/* ---------- Bootstrap ---------- */
document.addEventListener("DOMContentLoaded", init);
</script>
